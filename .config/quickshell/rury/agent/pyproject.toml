[project]
name = "rury-agent"
version = "0.1.0"
description = "Agentic assistant behind the SigniorAtif left sidebar: local-model loop, tools, skills, MCP, its own desktop"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "mcp>=1.9",
    "croniter>=2.0",
    "pillow>=11.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rury_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

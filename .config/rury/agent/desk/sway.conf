# The rury agent's desk: a headless sway the agent drives with its own cursor and keyboard.
# Started by ~/.config/quickshell/rury/agent/desk-session (systemd: rury-agent-desk.service).

output HEADLESS-1 {
    resolution 1280x800
    position 0 0
    bg #16161e solid_color
}

font pango:Noto Sans 10
default_border pixel 2
default_floating_border pixel 2
titlebar_padding 4 2
gaps inner 6
focus_follows_mouse no
focus_on_window_activation focus
mouse_warping none
xwayland enable

#                       border   bg       text     indicator child_border
client.focused          #8aadf4  #24273a  #cad3f5  #8aadf4   #8aadf4
client.unfocused        #363a4f  #1e2030  #a5adcb  #363a4f   #363a4f
client.focused_inactive #494d64  #1e2030  #cad3f5  #494d64   #494d64

# a new window takes the screen so the agent's screenshots stay simple
workspace_layout tabbed
for_window [app_id=".*"] focus
for_window [class=".*"] focus

set $mod Mod4
bindsym $mod+q kill
bindsym $mod+f fullscreen toggle
bindsym $mod+Tab focus next

# hand the agent the addresses it needs, then serve the screen to the viewer
exec sh -c 'f="$XDG_RUNTIME_DIR/rury/desk.env"; printf "WAYLAND_DISPLAY=%s\nSWAYSOCK=%s\nDISPLAY=%s\nDBUS_SESSION_BUS_ADDRESS=%s\n" "$WAYLAND_DISPLAY" "$SWAYSOCK" "$DISPLAY" "$DBUS_SESSION_BUS_ADDRESS" > "$f.tmp" && mv "$f.tmp" "$f"'
exec wayvnc --unix-socket --render-cursor --max-fps=20 --output=HEADLESS-1 --name="SigniorAtif Agent" "$XDG_RUNTIME_DIR/rury/desk-vnc.sock"
